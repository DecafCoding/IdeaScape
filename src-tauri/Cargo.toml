[package]
name = "ideascape"
version = "0.1.0"
description = "A visual note and canvas application"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ideascape_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset is what lets an <img src> read a file through the asset protocol; the
# scope is empty in tauri.conf.json and granted at runtime to one project's assets/ folder.
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.3"
log = "0.4"
time = { version = "0.3", features = ["formatting", "macros"] }
blake3 = "1"
url = "2"
scraper = "0.20"
# No default features: they pull the native TLS stack into a 20 MB installer budget.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
tokio = { version = "1", features = ["time"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "macros"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
